name: Build Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  smoke-test:
    # Runs the real first-run setup on Windows (CPU PyTorch, since CI has no GPU),
    # then narrates a test book with Kokoro and checks the outputs.
    runs-on: windows-latest
    env:
      AUDIOBOOKER_HOME: ${{ github.workspace }}\abhome
      AUDIOBOOKER_TORCH_INDEX: cpu
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv==0.11.32
      - name: First-run setup (same code path as Audiobooker.exe)
        run: python packaging\launcher.py --setup-only --headless
      - name: Make test PDFs
        run: |
          $py = "$env:AUDIOBOOKER_HOME\runtime\venv\Scripts\python.exe"
          & $py tests\make_test_pdfs.py testpdfs
      - name: Narrate a test book with Kokoro (CPU) to M4B and per-chapter MP3
        working-directory: app
        run: |
          $py = "$env:AUDIOBOOKER_HOME\runtime\venv\Scripts\python.exe"
          & $py -m audiobooker cli ..\testpdfs\outline_book.pdf --engine kokoro --voice af_heart --format m4b --chapters 5 --out ..\out
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $py -m audiobooker cli ..\testpdfs\scanned_book.pdf --engine kokoro --voice bm_george --format mp3_chapters --chapters 2 --out ..\out
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem -Recurse ..\out
      - name: One sentence from each engine (Chatterbox on CPU is slow but proves it works)
        working-directory: app
        run: |
          $py = "$env:AUDIOBOOKER_HOME\runtime\venv\Scripts\python.exe"
          $failed = $false
          foreach ($e in @("kokoro", "chatterbox_turbo", "chatterbox")) {
            cmd /c "`"$py`" ..\tests\engine_smoke.py $e > smoke_$e.log 2>&1"
            $rc = $LASTEXITCODE
            Get-Content "smoke_$e.log" -Tail 25
            if ($rc -ne 0) {
              $failed = $true
              # Surface the tail of the log as annotations (readable via the API).
              Get-Content "smoke_$e.log" -Tail 30 | ForEach-Object { if ($_.Trim()) { Write-Output "::error title=$e::$_" } }
            }
          }
          New-Item -ItemType Directory -Force ..\out | Out-Null
          if (Test-Path engine_smoke) { Copy-Item -Recurse -Force engine_smoke ..\out\engine_smoke }
          Copy-Item smoke_*.log ..\out\
          if ($failed) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-audio
          path: out
          if-no-files-found: ignore

  build:
    needs: smoke-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build
        run: powershell -ExecutionPolicy Bypass -File packaging\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Audiobooker-installer
          path: dist\Audiobooker-Setup-*.exe
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist\Audiobooker-Setup-*.exe
